<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho — SportZone</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #e63c00;
      --accent-dark: #b52d00;
      --surface: #1a1a1a;
      --border: #2a2a2a;
    }

    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: #000;
      padding: 0 2rem;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      color: white;
      letter-spacing: 2px;
      text-decoration: none;
    }

    .logo span { color: var(--accent); }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 50px;
      padding: 8px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
    }

    .back-btn:hover { color: white; border-color: #666; }

    /* ── PAGE TITLE ── */
    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 3px;
      text-align: center;
      padding: 2.5rem 2rem 0.5rem;
      color: white;
    }

    .page-subtitle {
      text-align: center;
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* ── CONTAINER ── */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    /* ── ESTADO VAZIO / LOADING ── */
    .estado {
      text-align: center;
      color: #555;
      margin-top: 4rem;
      font-size: 1rem;
      line-height: 2;
    }

    .estado .icone {
      font-size: 3rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    /* ── ITEM DO CARRINHO ── */
    .item {
      background: var(--surface);
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item-info strong {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .item-info .preco {
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 700;
    }

    .btn-remover {
      background: #2a2a2a;
      border: 1px solid #333;
      color: #aaa;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    .btn-remover:hover {
      background: #3a1a1a;
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ── TOTAL ── */
    .total-box {
      margin-top: 1.5rem;
      padding: 1rem 1.25rem;
      background: #1e1e1e;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2a2a2a;
    }

    .total-box span:first-child {
      font-size: 1rem;
      color: #aaa;
      font-weight: 500;
    }

    .total-valor {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
    }

    /* ── AÇÕES ── */
    .acoes {
      margin-top: 1.25rem;
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .acoes button {
      padding: 11px 24px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
    }

    .acoes button:active { transform: scale(0.97); }
    .acoes button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-limpar {
      background: #2a2a2a;
      color: #aaa;
      border: 1px solid #333 !important;
    }

    .btn-limpar:hover:not(:disabled) { background: #3a3a3a; color: white; }

    .btn-finalizar {
      background: var(--accent);
      color: white;
    }

    .btn-finalizar:hover:not(:disabled) { background: var(--accent-dark); }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: #222;
      color: white;
      padding: 13px 26px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 500;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 1.5rem;
      border-top: 1px solid #1a1a1a;
      color: #333;
      font-size: 0.8rem;
    }

    footer span { color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="index.html">Sport<span>Zone</span></a>
    <a class="back-btn" href="index.html">← Voltar à loja</a>
  </header>

  <div class="page-title">🛒 Seu Carrinho</div>
  <div class="page-subtitle">Confira os itens antes de finalizar</div>

  <div class="container" id="carrinhoContainer">
    <div class="estado">
      <span class="icone">⏳</span>
      Carregando carrinho...
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>&copy; 2025 <span>SportZone</span> — Todos os direitos reservados.</footer>

  <!-- ✅ Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ✅ CONFIGURAÇÃO SUPABASE
    const SUPABASE_URL = "https://uelsmyxiynsbrrmacnac.supabase.co";
    const SUPABASE_KEY = "sb_publishable_mM1iJ-wcjqb3-W6jVpbXtg_ab1Kv3JO";

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_KEY);

    const container = document.getElementById("carrinhoContainer");

    // ── TOAST ──
    const toastEl = document.getElementById("toast");
    let toastTimer;

    function showToast(msg) {
      clearTimeout(toastTimer);
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2800);
    }

    // ── CARREGAR CARRINHO ──
    async function carregarCarrinho() {
      container.innerHTML = `<div class="estado"><span class="icone">⏳</span>Carregando carrinho...</div>`;

      const { data, error } = await client
        .from("carrinho")
        .select("*")
        .order("id", { ascending: true });

      if (error) {
        console.error("Erro ao carregar carrinho:", error);
        container.innerHTML = `<div class="estado"><span class="icone">❌</span>Erro ao carregar o carrinho.<br>Verifique sua conexão.</div>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<div class="estado"><span class="icone">🛒</span>Seu carrinho está vazio.<br><a href="index.html" style="color:#e63c00;text-decoration:none;font-weight:700;">Ver produtos →</a></div>`;
        return;
      }

      renderCarrinho(data);
    }

    // ── RENDERIZAR ITENS ──
    function renderCarrinho(items) {
      container.innerHTML = "";

      let total = 0;

      items.forEach(item => {
        total += Number(item.preco);

        const div = document.createElement("div");
        div.classList.add("item");
        div.id = "item-" + item.id;

        div.innerHTML = `
          <div class="item-info">
            <strong>${item.nome}</strong>
            <span class="preco">R$ ${Number(item.preco).toFixed(2).replace(".", ",")}</span>
          </div>
          <button class="btn-remover" onclick="removerItem(${item.id})" title="Remover item">🗑</button>
        `;

        container.appendChild(div);
      });

      // ── TOTAL ──
      const totalBox = document.createElement("div");
      totalBox.classList.add("total-box");
      totalBox.id = "totalBox";
      totalBox.innerHTML = `
        <span>Total (${items.length} item${items.length > 1 ? "s" : ""})</span>
        <span class="total-valor">R$ ${total.toFixed(2).replace(".", ",")}</span>
      `;
      container.appendChild(totalBox);

      // ── AÇÕES ──
      const acoes = document.createElement("div");
      acoes.classList.add("acoes");
      acoes.id = "acoes";
      acoes.innerHTML = `
        <button class="btn-limpar" id="btnLimpar" onclick="limparCarrinho()">🗑 Limpar carrinho</button>
        <button class="btn-finalizar" id="btnFinalizar" onclick="finalizarCompra()">✅ Finalizar compra</button>
      `;
      container.appendChild(acoes);
    }

    // ── REMOVER ITEM ──
    async function removerItem(id) {
      const btn = document.querySelector(`#item-${id} .btn-remover`);
      if (btn) btn.disabled = true;

      const { error } = await client
        .from("carrinho")
        .delete()
        .eq("id", id);

      if (error) {
        console.error("Erro ao remover item:", error);
        showToast("❌ Erro ao remover item.");
        if (btn) btn.disabled = false;
        return;
      }

      showToast("🗑 Item removido.");
      await carregarCarrinho();
    }

    // ── LIMPAR CARRINHO ──
    async function limparCarrinho() {
      const btn = document.getElementById("btnLimpar");
      if (btn) btn.disabled = true;

      // Deleta todos os registros da tabela
      const { error } = await client
        .from("carrinho")
        .delete()
        .gte("id", 0);

      if (error) {
        console.error("Erro ao limpar carrinho:", error);
        showToast("❌ Erro ao limpar carrinho.");
        if (btn) btn.disabled = false;
        return;
      }

      showToast("🗑 Carrinho limpo.");
      await carregarCarrinho();
    }

    // ── FINALIZAR COMPRA ──
    async function finalizarCompra() {
      const btnF = document.getElementById("btnFinalizar");
      const btnL = document.getElementById("btnLimpar");
      if (btnF) btnF.disabled = true;
      if (btnL) btnL.disabled = true;
      if (btnF) btnF.textContent = "Processando...";

      const { error } = await client
        .from("carrinho")
        .delete()
        .gte("id", 0);

      if (error) {
        console.error("Erro ao finalizar compra:", error);
        showToast("❌ Erro ao finalizar. Tente novamente.");
        if (btnF) { btnF.disabled = false; btnF.textContent = "✅ Finalizar compra"; }
        if (btnL) btnL.disabled = false;
        return;
      }

      showToast("🎉 Compra finalizada com sucesso!");
      setTimeout(() => carregarCarrinho(), 1500);
    }

    // ── INICIAR ──
    carregarCarrinho();
  </script>

</body>
</html>
