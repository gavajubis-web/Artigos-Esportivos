<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SportZone</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 3px;
      margin-bottom: 2rem;
    }

    .logo span { color: #e63c00; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }

    .card h2 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .card p {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }

    .tab {
      flex: 1;
      padding: 9px;
      border: 1px solid #333;
      border-radius: 8px;
      background: transparent;
      color: #666;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: #e63c00;
      color: white;
      border-color: #e63c00;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: #888;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input {
      width: 100%;
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 11px 14px;
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #e63c00;
    }

    .btn-principal {
      width: 100%;
      background: #e63c00;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 13px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 1rem;
    }

    .btn-principal:hover { background: #b52d00; }
    .btn-principal:disabled { opacity: 0.6; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      color: #444;
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #2a2a2a;
    }

    .btn-google {
      width: 100%;
      background: white;
      color: #111;
      border: none;
      border-radius: 50px;
      padding: 13px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-google:hover { background: #f0f0f0; }
    .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg {
      margin-top: 1rem;
      font-size: 0.88rem;
      text-align: center;
      min-height: 20px;
    }

    .msg.erro { color: #e63c00; }
    .msg.ok { color: #4ade80; }
  </style>
</head>
<body>

  <div class="logo">Sport<span>Zone</span></div>

  <div class="card">
    <h2>Bem-vindo!</h2>
    <p>Entre na sua conta para continuar</p>

    <div class="tabs">
      <button class="tab active" id="tabEntrar" onclick="trocarTab('entrar')">Entrar</button>
      <button class="tab" id="tabCadastrar" onclick="trocarTab('cadastrar')">Cadastrar</button>
    </div>

    <div id="formEntrar">
      <label>Email</label>
      <input type="email" id="emailEntrar" placeholder="seu@email.com">
      <label>Senha</label>
      <input type="password" id="senhaEntrar" placeholder="••••••••">
      <button class="btn-principal" id="btnEntrar" onclick="entrar()">Entrar</button>
    </div>

    <div id="formCadastrar" style="display:none">
      <label>Email</label>
      <input type="email" id="emailCadastrar" placeholder="seu@email.com">
      <label>Senha</label>
      <input type="password" id="senhaCadastrar" placeholder="mínimo 6 caracteres">
      <button class="btn-principal" id="btnCadastrar" onclick="cadastrar()">Criar conta</button>
    </div>

    <div class="divider">ou</div>

    <button class="btn-google" id="btnGoogle" onclick="entrarGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.5 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.6 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-8L6 33.3C9.3 39.6 16.1 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.4-2.5 4.4-4.6 5.8l6.2 5.2C40.8 35.4 44 30.1 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
      Continuar com Google
    </button>

    <div class="msg" id="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://uelsmyxiynsbrrmacnac.supabase.co";
    const SUPABASE_KEY = "sb_publishable_mM1iJ-wcjqb3-W6jVpbXtg_ab1Kv3JO";
    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_KEY);

    function trocarTab(tab) {
      document.getElementById("formEntrar").style.display = tab === "entrar" ? "block" : "none";
      document.getElementById("formCadastrar").style.display = tab === "cadastrar" ? "block" : "none";
      document.getElementById("tabEntrar").classList.toggle("active", tab === "entrar");
      document.getElementById("tabCadastrar").classList.toggle("active", tab === "cadastrar");
      document.getElementById("msg").textContent = "";
    }

    function mostrarMsg(texto, tipo) {
      const el = document.getElementById("msg");
      el.textContent = texto;
      el.className = "msg " + tipo;
    }

    async function entrar() {
      const email = document.getElementById("emailEntrar").value.trim();
      const senha = document.getElementById("senhaEntrar").value;
      const btn = document.getElementById("btnEntrar");

      if (!email || !senha) return mostrarMsg("Preencha email e senha.", "erro");

      btn.disabled = true;
      btn.textContent = "Entrando...";

      const { error } = await client.auth.signInWithPassword({ email, password: senha });

      if (error) {
        mostrarMsg("Email ou senha incorretos.", "erro");
        btn.disabled = false;
        btn.textContent = "Entrar";
      } else {
        mostrarMsg("✅ Login feito! Redirecionando...", "ok");
        setTimeout(() => window.location.href = "index.html", 1000);
      }
    }

    async function cadastrar() {
      const email = document.getElementById("emailCadastrar").value.trim();
      const senha = document.getElementById("senhaCadastrar").value;
      const btn = document.getElementById("btnCadastrar");

      if (!email || !senha) return mostrarMsg("Preencha email e senha.", "erro");
      if (senha.length < 6) return mostrarMsg("Senha precisa ter pelo menos 6 caracteres.", "erro");

      btn.disabled = true;
      btn.textContent = "Criando conta...";

      const { error } = await client.auth.signUp({ email, password: senha });

      if (error) {
        mostrarMsg("Erro: " + error.message, "erro");
        btn.disabled = false;
        btn.textContent = "Criar conta";
      } else {
        mostrarMsg("✅ Conta criada! Verifique seu email.", "ok");
        btn.disabled = false;
        btn.textContent = "Criar conta";
      }
    }

    async function entrarGoogle() {
      const btn = document.getElementById("btnGoogle");
      btn.disabled = true;

      const { error } = await client.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + "/index.html" }
      });

      if (error) {
        mostrarMsg("Erro ao entrar com Google.", "erro");
        btn.disabled = false;
      }
    }

    // Se já está logado vai direto pra loja
    client.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = "index.html";
    });
  </script>

</body>
</html>
