<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho - SportZone</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      color: #e63c00;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .item {
      background: #1a1a1a;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 4px solid #e63c00;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls button {
      background: #e63c00;
      border: none;
      color: white;
      padding: 5px 10px;
      margin: 0 3px;
      border-radius: 5px;
      cursor: pointer;
    }

    .total {
      margin-top: 20px;
      font-size: 1.5rem;
      color: #e63c00;
      font-weight: bold;
      text-align: right;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .actions button {
      padding: 10px 15px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
    }

    .clear {
      background: #444;
      color: white;
    }

    .buy {
      background: #e63c00;
      color: white;
    }

    .vazio {
      text-align: center;
      color: #888;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <header>SEU CARRINHO</header>

  <div class="container" id="carrinho"></div>

  <script>
    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

    function salvar() {
      localStorage.setItem("carrinho", JSON.stringify(carrinho));
      render();
    }

    function mudarQtd(index, valor) {
      carrinho[index].qtd += valor;

      if (carrinho[index].qtd <= 0) {
        carrinho.splice(index, 1);
      }

      salvar();
    }

    function removerItem(index) {
      carrinho.splice(index, 1);
      salvar();
    }

    function limparCarrinho() {
      carrinho = [];
      salvar();
    }

    function finalizarCompra() {
      alert("Compra finalizada com sucesso! 🎉");
      limparCarrinho();
    }

    function render() {
      const container = document.getElementById("carrinho");
      container.innerHTML = "";

      if (carrinho.length === 0) {
        container.innerHTML = "<p class='vazio'>Seu carrinho está vazio 🛒</p>";
        return;
      }

      let total = 0;

      carrinho.forEach((item, index) => {

        if (!item.qtd) item.qtd = 1;

        total += item.preco * item.qtd;

        const div = document.createElement("div");
        div.classList.add("item");

        div.innerHTML = `
          <div>
            <strong>${item.nome}</strong><br>
            R$ ${item.preco.toFixed(2)}
          </div>

          <div class="controls">
            <button onclick="mudarQtd(${index}, -1)">-</button>
            ${item.qtd}
            <button onclick="mudarQtd(${index}, 1)">+</button>
            <button onclick="removerItem(${index})">🗑</button>
          </div>
        `;

        container.appendChild(div);
      });

      const totalDiv = document.createElement("div");
      totalDiv.classList.add("total");
      totalDiv.innerText = "Total: R$ " + total.toFixed(2);

      container.appendChild(totalDiv);

      const actions = document.createElement("div");
      actions.classList.add("actions");

      actions.innerHTML = `
        <button class="clear" onclick="limparCarrinho()">Limpar carrinho</button>
        <button class="buy" onclick="finalizarCompra()">Finalizar compra</button>
      `;

      container.appendChild(actions);
    }

    render();
  </script>

</body>
</html>
