<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho - SportZone</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 2px;
      color: #e63c00;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .item {
      background: #1a1a1a;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 4px solid #e63c00;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
    }

    .total {
      margin-top: 20px;
      font-size: 1.5rem;
      color: #e63c00;
      font-weight: bold;
      text-align: right;
    }

    .vazio {
      text-align: center;
      color: #888;
      margin-top: 50px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      background: #e63c00;
      color: white;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }

    button:hover {
      background: #b52d00;
    }
  </style>
</head>

<body>

  <header>
    SEU CARRINHO
  </header>

  <div class="container" id="carrinho"></div>

  <script>
    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
    
    // elementos da página
    const cartCountEl = document.getElementById("cartCount");
    const toast = document.getElementById("toast");
    let toastTimer;
    
    // contador já vem do carrinho salvo
    let cartCount = carrinho.length;
    cartCountEl.textContent = cartCount;
    
    // toast
    function showToast(msg) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
    }
    
    // adicionar produto no carrinho
    function addToCart(nome, preco) {
    
      let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
    
      carrinho.push({
        nome: nome,
        preco: preco
    });
  
    localStorage.setItem("carrinho", JSON.stringify(carrinho));
  
    // atualiza contador corretamente
    cartCount = carrinho.length;
    cartCountEl.textContent = cartCount;
  
    showToast("✅ " + nome + " adicionado ao carrinho!");
  }
  
  // botões de produtos
  document.getElementById("botaoBola")
    .addEventListener("click", () => addToCart("Bola de Futebol", 89.90));
  
  document.getElementById("botaoChuteira")
    .addEventListener("click", () => addToCart("Chuteira", 199.90));
  
  document.getElementById("botaoRaquete")
    .addEventListener("click", () => addToCart("Raquete de Tênis", 249.90));
  
  document.getElementById("botaoBolaTenis")
    .addEventListener("click", () => addToCart("Bola de Tênis", 34.90));
  
  // botão carrinho abre página
  document.getElementById("cartBtn")
    .addEventListener("click", () => {
      window.location.href = "carrinho.html";
    });
  </script>

</body>

</html>
