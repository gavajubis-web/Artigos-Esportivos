<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho - SportZone</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      color: #e63c00;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .item {
      background: #1a1a1a;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 4px solid #e63c00;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls button {
      background: #e63c00;
      border: none;
      color: white;
      padding: 5px 10px;
      margin: 0 3px;
      border-radius: 5px;
      cursor: pointer;
    }

    .total {
      margin-top: 20px;
      font-size: 1.5rem;
      color: #e63c00;
      font-weight: bold;
      text-align: right;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .actions button {
      padding: 10px 15px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
    }

    .clear {
      background: #444;
      color: white;
    }

    .buy {
      background: #e63c00;
      color: white;
    }

    .vazio {
      text-align: center;
      color: #888;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <header>SEU CARRINHO</header>

  <div class="container" id="carrinho"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const supabaseUrl = "https://uelsmyxiynsbrrmacnac.supabase.co";
  const supabaseKey = "SUA_CHAVE_PUBLICA_AQUI";

  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  const container = document.getElementById("carrinho");

  // 🔥 carregar carrinho do banco
  async function carregarCarrinho() {
    const { data, error } = await supabase
      .from("carrinho")
      .select("*");

    if (error) {
      console.log(error);
      container.innerHTML = "<p class='vazio'>Erro ao carregar carrinho</p>";
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = "<p class='vazio'>Seu carrinho está vazio 🛒</p>";
      return;
    }

    render(data);
  }

  // 🔥 remover item
  async function removerItem(id) {
    await supabase
      .from("carrinho")
      .delete()
      .eq("id", id);

    carregarCarrinho();
  }

  // 🔥 limpar carrinho
  async function limparCarrinho() {
    await supabase
      .from("carrinho")
      .delete()
      .neq("id", 0);

    carregarCarrinho();
  }

  // 🔥 finalizar compra
  function finalizarCompra() {
    alert("Compra finalizada com sucesso! 🎉");
    limparCarrinho();
  }

  // 🔥 render da tela
  function render(items) {
    container.innerHTML = "";

    let total = 0;

    items.forEach(item => {
      total += Number(item.preco);

      const div = document.createElement("div");
      div.classList.add("item");

      div.innerHTML = `
        <div>
          <strong>${item.nome}</strong><br>
          R$ ${Number(item.preco).toFixed(2)}
        </div>

        <div class="controls">
          <button onclick="removerItem(${item.id})">🗑</button>
        </div>
      `;

      container.appendChild(div);
    });

    const totalDiv = document.createElement("div");
    totalDiv.classList.add("total");
    totalDiv.innerText = "Total: R$ " + total.toFixed(2);

    container.appendChild(totalDiv);

    const actions = document.createElement("div");
    actions.classList.add("actions");

    actions.innerHTML = `
      <button class="clear" onclick="limparCarrinho()">Limpar carrinho</button>
      <button class="buy" onclick="finalizarCompra()">Finalizar compra</button>
    `;

    container.appendChild(actions);
  }

  carregarCarrinho();
</script>

</body>
</html>
