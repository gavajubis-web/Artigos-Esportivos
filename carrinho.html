<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho - SportZone</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 2px;
      color: #e63c00;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .item {
      background: #1a1a1a;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 4px solid #e63c00;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
    }

    .total {
      margin-top: 20px;
      font-size: 1.5rem;
      color: #e63c00;
      font-weight: bold;
      text-align: right;
    }

    .vazio {
      text-align: center;
      color: #888;
      margin-top: 50px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      background: #e63c00;
      color: white;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }

    button:hover {
      background: #b52d00;
    }
  </style>
</head>

<body>

  <header>
    SEU CARRINHO
  </header>

  <div class="container" id="carrinho"></div>

  <script>
    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

    const container = document.getElementById("carrinho");

    if (carrinho.length === 0) {
      container.innerHTML = "<p class='vazio'>Seu carrinho está vazio 🛒</p>";
    } else {

      let total = 0;

      carrinho.forEach(item => {
        total += item.preco;

        const div = document.createElement("div");
        div.classList.add("item");

        div.innerHTML = `
          <span>${item.nome}</span>
          <span>R$ ${item.preco.toFixed(2)}</span>
        `;

        container.appendChild(div);
      });

      const totalDiv = document.createElement("div");
      totalDiv.classList.add("total");
      totalDiv.innerText = "Total: R$ " + total.toFixed(2);

      container.appendChild(totalDiv);
    }
  </script>

</body>

</html>
